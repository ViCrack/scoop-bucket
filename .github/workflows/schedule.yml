on:
  workflow_dispatch:
  schedule:
    # 这里可以调整时间
    # 每天在指定时间的20分执行（UTC时间需要减8小时）
    - cron: "20 0 * * *"   # 北京时间早上8点
    - cron: "20 2 * * *"   # 北京时间上午10点
    - cron: "20 6 * * *"   # 北京时间下午2点
    - cron: "20 8 * * *"   # 北京时间下午4点
    - cron: "20 10 * * *"  # 北京时间下午6点
    - cron: "20 12 * * *"  # 北京时间晚上8点
    - cron: "20 13 * * *"  # 北京时间晚上9点
    - cron: "20 15 * * *"  # 北京时间晚上11点
name: Excavator
jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Prepare Scoop and hub
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Match the paths used by ScoopInstaller/GithubActions.
          $env:SCOOP = Join-Path $env:USERPROFILE 'SCOOP'
          $env:SCOOP_GLOBAL = Join-Path $env:SystemDrive 'SCOOP'
          $shims = Join-Path $env:SCOOP 'shims'
          $globalShims = Join-Path $env:SCOOP_GLOBAL 'shims'
          if (-not (Test-Path (Join-Path $shims 'scoop.ps1'))) {
            Invoke-RestMethod 'https://raw.githubusercontent.com/ScoopInstaller/Install/master/install.ps1' -MaximumRetryCount 3 -RetryIntervalSec 10 | Invoke-Expression
          }
          $env:PATH = "$shims;$globalShims;$env:PATH"
          $shims, $globalShims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop config USE_EXTERNAL_7ZIP true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure Scoop.' }
          ./bin/install-excavator-hub.ps1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: "1"
          USER_NAME: "ViCrack"
          USER_EMAIL: "18179821+ViCrack@users.noreply.github.com"
          BUCKET: "ViCrack/scoop-bucket"
          THROW_ERROR: "0"
